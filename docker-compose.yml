services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sahayak
      POSTGRES_USER: sahayak
      POSTGRES_PASSWORD: sahayak_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahayak -d sahayak"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://sahayak:sahayak_password@db:5432/sahayak
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      ADMIN_TOKEN: sahayak-admin-token-live
      JWT_SECRET: sahayak-jwt-secret-live-production
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:8000"
    ports:
      - "8000:8000"

volumes:
  pgdata:
