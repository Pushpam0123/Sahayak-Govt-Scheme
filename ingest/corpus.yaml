schemes:
  - id: pm-kisan
    name: Pradhan Mantri Kisan Samman Nidhi
    state: Central
    ministry: Ministry of Agriculture and Farmers Welfare
    category: Agriculture
    summary: Financial assistance of ₹6,000 per year payable in three equal four-monthly installments to all landholding farmer families.
    benefit_amount: "₹6,000 / year"
    benefit_type: "Direct Benefit Transfer (DBT)"
    required_documents:
      - "Aadhaar Card"
      - "Bank Account Passbook (DBT-enabled)"
      - "Land Ownership Record (Khatian / ROR)"
      - "Citizenship Proof"
    application_mode: "online"
    application_url: "https://pmkisan.gov.in/RegistrationFormNew.aspx"
    deadlines: "Rolling throughout the year"
    helpline: "155261 / 011-24300606"
    official_url: "https://pmkisan.gov.in"
    source_url: "https://pmkisan.gov.in/Documents/RevisedPM-KISANOperationalGuidelines(English).pdf"
    verified_on: 2026-08-26

  - id: pm-fby
    name: Pradhan Mantri Fasal Bima Yojana
    state: Central
    ministry: Ministry of Agriculture and Farmers Welfare
    category: Agriculture
    summary: Comprehensive crop insurance protecting farmers against yield loss due to non-preventable natural risks with heavily subsidized farmer premium rates.
    benefit_amount: "Full Crop Loss Insurance Cover"
    benefit_type: "Subsidized Crop Insurance"
    required_documents:
      - "Aadhaar Card"
      - "Land Revenue Receipt / Land Possession Certificate"
      - "Crop Sowing Certificate / Self-Declaration"
      - "Bank Account Passbook"
    application_mode: "hybrid"
    application_url: "https://pmfby.gov.in"
    deadlines: "Kharif: July 31 | Rabi: Dec 31"
    helpline: "14447 / 1800-180-1551"
    official_url: "https://pmfby.gov.in"
    source_url: "https://pmfby.gov.in/pdf/Revised_Operational_Guidelines.pdf"
    verified_on: 2026-08-26

  - id: pm-jjby
    name: Pradhan Mantri Jeevan Jyoti Bima Yojana
    state: Central
    ministry: Ministry of Finance
    category: Insurance
    summary: One-year renewable life insurance scheme offering ₹2 Lakh death cover for any reason to individuals aged 18 to 50 years.
    benefit_amount: "₹2,00,000 Life Insurance"
    benefit_type: "Life Insurance Cover"
    required_documents:
      - "Aadhaar Card"
      - "Savings Bank Account with Auto-Debit Consent"
      - "KYC Identity Proof"
    application_mode: "hybrid"
    application_url: "https://www.jansuraksha.gov.in"
    deadlines: "Annual renewal by May 31 (Premium: ₹436/year)"
    helpline: "1800-180-1111 / 1800-110-001"
    official_url: "https://www.jansuraksha.gov.in"
    source_url: "https://www.jansuraksha.gov.in/Files/PMJJBY/English/Rules.pdf"
    verified_on: 2026-08-26
    tls_insecure: true
    tls_insecure_reason: "jansuraksha.gov.in serves only its leaf certificate without the GlobalSign GCC R3 EV TLS CA 2025 intermediate, so the chain cannot be completed locally (OpenSSL verify error 20/21: unable to get local issuer certificate). Confirmed on 2026-08-26 via `openssl s_client`; the leaf cert itself is a valid EV certificate for jansuraksha.gov.in issued to Punjab National Bank."

