  - id: pm-matru-vandana
    name: Pradhan Mantri Matru Vandana Yojana
    state: Central
    ministry: Ministry of Women and Child Development
    category: Women & Child Development
    summary: Conditional maternity cash incentive of ₹5,000 for the first child and ₹6,000 if the second child is female, promoting maternal and child health.
    benefit_amount: "₹5,000 – ₹6,000 DBT"
    benefit_type: "Maternity Cash Benefit (DBT)"
    required_documents:
      - "Mother's Aadhaar Card"
      - "Father's Aadhaar Card"
      - "MCP (Mother and Child Protection) Card"
      - "Bank Account Passbook"
      - "Child Birth Certificate"
    application_mode: "hybrid"
    application_url: "https://pmmvy.wcd.gov.in"
    deadlines: "Within 270 days of LMP"
    helpline: "1098 / 011-23382393"
    official_url: "https://pmmvy.wcd.gov.in"
    source_url: "https://pmmvy.wcd.gov.in/Content/assets/PDF/MissionShaktiGuidelines.pdf"
    verified_on: 2026-08-26

  - id: stand-up-india
    name: Stand-Up India Scheme
    state: Central
    ministry: Ministry of Finance
    category: Finance & Business
    summary: Bank loans between ₹10 Lakh and ₹100 Lakh for setting up a greenfield enterprise in manufacturing, services, agri-allied or trading sectors by SC/ST or women borrowers.
    benefit_amount: "₹10 Lakh – ₹1 Crore Loan"
    benefit_type: "Subsidized Enterprise Loan"
    required_documents:
      - "PAN Card & Aadhaar Card"
      - "SC/ST Certificate (if applicable)"
      - "Detailed Project Report (DPR)"
      - "Proof of Business Premises / Land"
    application_mode: "online"
    application_url: "https://www.standupmitra.in"
    deadlines: "Rolling application"
    helpline: "1800-180-1159"
    official_url: "https://www.standupmitra.in"
    source_url: "https://www.standupmitra.in/Default/DownloadFile/Stand%20Up%20India%20-%20Brochure%20-%20English.pdf"
    verified_on: 2026-08-26

  - id: mp-ladli-behna
    name: Mukhyamantri Ladli Behna Yojana (Madhya Pradesh)
    state: Madhya Pradesh
    ministry: Department of Women and Child Development
    category: Women & Child Development
    summary: Monthly financial assistance of ₹1,250 deposited directly into the bank accounts of eligible resident women of Madhya Pradesh.
    benefit_amount: "₹1,250 / month"
    benefit_type: "Direct Cash Transfer (Monthly)"
    required_documents:
      - "Samagra Family & Member ID"
      - "Aadhaar Card (e-KYC completed)"
      - "Bank Account linked with Aadhaar and DBT enabled"
    application_mode: "offline"
    application_url: "https://cmladlibahna.mp.gov.in"
    deadlines: "Annual registration drives"
    helpline: "0755-2700800"
    official_url: "https://cmladlibahna.mp.gov.in"
    source_url: "https://cmladlibahna.mp.gov.in/Uploaded%20Document/UpcomingEvents/25072023014055LBY%20sanshodhit%20guideline.pdf"
    verified_on: 2026-08-26

  - id: ka-gruha-jyothi
    name: Gruha Jyothi Scheme (Karnataka)
    state: Karnataka
    ministry: Department of Energy
    category: Power & Welfare
    summary: Zero electricity billing for domestic households in Karnataka consuming up to 200 units per month based on their calculated monthly entitlement.
    benefit_amount: "Up to 200 units free power / month"
    benefit_type: "Electricity Bill Subsidy"
    required_documents:
      - "Aadhaar Card"
      - "Electricity Consumer Account ID (Account ID on Bill)"
      - "Tenancy Agreement / Rental Deed (for tenants)"
    application_mode: "online"
    application_url: "https://sevasindhugs.karnataka.gov.in"
    deadlines: "Rolling registration"
    helpline: "1912"
    official_url: "https://sevasindhugs.karnataka.gov.in"
    source_url: "https://sevasindhugs.karnataka.gov.in/PDF/Gruha_Jyothi_Kannada.pdf"
