  - id: atal-pension-yojana
    name: Atal Pension Yojana
    state: Central
    ministry: Ministry of Finance
    category: Pension
    summary: Guaranteed minimum monthly pension of ₹1,000 to ₹5,000 starting from age 60 for subscribers joining between 18 and 40 years.
