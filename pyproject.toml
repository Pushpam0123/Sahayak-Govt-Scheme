[project]
name = "sahayak"
version = "0.1.0"
description = "A multilingual RAG assistant for Indian government schemes"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.28.0",
    "alembic>=1.11.0",
    "anthropic>=0.18.0",
    "voyageai>=0.2.0",
    "google-genai>=1.0.0",
    "pdfplumber>=0.10.0",
    "trafilatura>=1.6.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "pgvector>=0.2.0",
    "beautifulsoup4>=4.11.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-pyyaml>=6.0.12.12",
    "lxml_html_clean>=0.1.0"
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.setuptools]
packages = ["api", "ingest", "eval"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["web/"]
