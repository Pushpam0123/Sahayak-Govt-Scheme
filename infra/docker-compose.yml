version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sahayak-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sahayak
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sahayak"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../
      dockerfile: infra/Dockerfile.api
    container_name: sahayak-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/sahayak
      - ENVIRONMENT=development
      - PORT=8000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    volumes:
      - ../:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../
      dockerfile: infra/Dockerfile.web
    container_name: sahayak-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    volumes:
      - ../:/app
      - /app/web/node_modules
      - /app/web/.next
    depends_on:
      - api

volumes:
  pgdata:
